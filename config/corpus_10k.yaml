version: "1.0.0"
seed: 20260726
language: en
variety: en-US
target_sentences: 10000

sources:
  primary:
    corpus: MASC
    version: "3.0.0"
    official_page: "https://anc.org/data/masc/downloads/data-download/"
    archive_url: "https://www.anc.org/MASC/download/masc_500k_texts.zip"
    archive_filename: "masc_500k_texts.zip"
    licence: "CC BY 3.0 US"
    prefer_archive: data-only
  fallback:
    corpus: OANC
    version: "GrAF release 2011-07-16"
    official_page: "https://anc.org/data/oanc/download/"
    archive_url: "https://www.anc.org/OANC/OANC_GrAF.zip"
    archive_filename: "OANC_GrAF.zip"
    licence: "Unrestricted use and redistribution for research and development, including commercial development (official OANC download terms)"
    subset: written

selection:
  lexical_tokens:
    min: 5
    max: 40
  max_sentences_per_document: 75
  max_document_fraction: 0.01
  require_unique_normalized_text: true
  near_duplicate_threshold: 0.92
  excluded_genres_initial:
    - spam
    - twitter
    - jokes
  written_genres:
    blog: 700
    email: 700
    essay: 700
    fiction: 700
    ficlets: 700
    government: 700
    journal: 700
    letters: 700
    newspaper: 700
    nonfiction: 700
    technical: 700
    travel: 700
  dialogic_genres:
    court: 400
    debate: 400
    spoken: 400
    movie-script: 400
  difficulty:
    basic: 0.35
    intermediate: 0.45
    advanced: 0.20

annotation:
  engine: stanza
  processors:
    - tokenize
    - mwt
    - pos
    - lemma
    - depparse
  use_gpu_if_available: true
  batch_size: auto
  resume: true

question_generation:
  require_at_least_one_question_per_sentence: true
  retain_primary_question_per_sentence: true
  controlled_vocabulary: config/pedagogical_tagset_en.json
  statuses:
    reviewed: martin-reviewed
    generated: auto-high-confidence
    review: needs-review
    rejected: rejected
  reviewed_round_weight: 0.15
  public_options: 4
  allow_raw_annotation_labels_in_public: false

public_build:
  shard_question_count: 400
  initial_payload_max_bytes: 500000
  shard_max_bytes: 500000
  recent_question_ids_per_mode: 250
  recent_sentence_ids_per_mode: 150
