          "contract_signals": [
            "nsubj",
            "nsubj with internal modifier"
          ]
        }
      },
      "output": {
        "label": "S — Subject",
        "mode": "sentence-elements",
        "subskill": "Sentence elements"
      },
      "priority": 100,
      "rule_id": "se.subject.np",
      "source_case_ids": [
        "SE-S-01",
        "SE-S-02"
      ],
      "target": {
        "custom_handler": "adapter-target-spans",
        "strategy": "anchor-subtree",
        "trim_punctuation": true
      },
      "teacher_notes": [],
