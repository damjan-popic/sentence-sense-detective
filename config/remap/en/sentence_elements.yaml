          "event_review_reason": "Formal it and the postponed clause must be confirmed as two linked subject annotations."
        },
        "sentence": {
          "contract_signals": [
            "expl + extraposed clause"
          ]
        }
      },
      "output": {
        "label": "Formal S + Postponed S",
        "mode": "sentence-elements",
        "subskill": "Sentence elements"
      },
