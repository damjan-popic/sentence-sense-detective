    {
      "action": "review",
      "decision_class": "manual-review",
      "description": "Formal registry rule compiled from SE-S-06.",
      "dimension": "sentence_element",
      "exclude": [
        {
          "operator": "event-status-not-equal",
          "value": "needs-review"
        }
