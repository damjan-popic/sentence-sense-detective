      "target": {
        "custom_handler": "adapter-target-spans",
        "strategy": "anchor-subtree",
        "trim_punctuation": true
      },
      "teacher_notes": [
        "SE-S-06: A pri \"postponed clausal S\" bi se dalo, da bi bila analiza bolj precizna (i.e., da gre za infinitival clause)?"
      ],
      "version": "1.0.0"
    },
